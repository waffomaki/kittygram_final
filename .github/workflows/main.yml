name: Main Kittygram workflow

on:
  push:
    branches: [main]

jobs:
  # 1. Тесты бэкенда
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          POSTGRES_DB: kittygram
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install --upgrade pip ruff==0.8.0 -r backend/requirements.txt
      - env:
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          POSTGRES_DB: kittygram
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          ruff check backend/
          cd backend && python manage.py test

  # 2. Сборка и отправка бэкенда
  build_and_push_to_docker_hub:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: ${{ secrets.DOCKER_USERNAME }}, password: ${{ secrets.DOCKER_PASSWORD }} }
      - uses: docker/build-push-action@v5
        with: { context: ./backend, push: true, tags: waffomaki/kittygram_backend:latest }

  # 3. Тесты фронтенда
  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: |
          cd frontend
          npm ci
          npm test

  # 4. Сборка и отправка фронтенда
  build_frontend_and_push_to_docker_hub:
    needs: frontend_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: ${{ secrets.DOCKER_USERNAME }}, password: ${{ secrets.DOCKER_PASSWORD }} }
      - uses: docker/build-push-action@v5
        with: { context: ./frontend, push: true, tags: waffomaki/kittygram_frontend:latest }

  # 5. Сборка и отправка шлюза
  build_gateway_and_push_to_docker_hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: ${{ secrets.DOCKER_USERNAME }}, password: ${{ secrets.DOCKER_PASSWORD }} }
      - uses: docker/build-push-action@v5
        with: { context: ./nginx, push: true, tags: waffomaki/kittygram_gateway:latest }

  # 6. Уведомление в Telegram (после успешной сборки всех образов)
  send_message:
    needs: [build_and_push_to_docker_hub, build_frontend_and_push_to_docker_hub, build_gateway_and_push_to_docker_hub]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "Образы Kittygram загружены"
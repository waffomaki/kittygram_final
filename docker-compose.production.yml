version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: waffomaki/kittygram_backend:latest
    env_file: .env
    volumes:
      - media:/app/media
    depends_on:
      - db
  frontend:
    image: waffomaki/kittygram_frontend:latest
    env_file: .env
    volumes:
      - static:/static
  gateway:
    image: waffomaki/kittygram_gateway:latest
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - backend
